name: label-handling

on:
  pull_request:
    types: [labeled,unlabeled]

permissions:
  pull-requests: write
  actions: write

jobs:
  handle-label:
    runs-on: ubuntu-latest
    steps:
      - name: validate trigger
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const white= new Set([
              "ready-to-merge",
              "codex-reviewed"
            ]);
            const black= new Set([
              "do-not-merge",
              "something-wrong"
            ]);
            let shouldDispatch = false;
            const label = context.payload.label?.name;
            shouldDispatch =
              white.has(label) ||
              black.has(label) ||
              label === "validate";
            
            if (!shouldDispatch) {
                console.log("No validation required.");
                return;
            }
            
            console.log("Dispatching validate.yml");
            
            await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "validate.yml",
                ref: context.payload.pull_request.head.ref,
                inputs: {
                    "pr-number": context.payload.pull_request.number.toString()
                }
            });