name: Manual Codex Review

on:
  pull_request:
    types:
      - labeled # - triggered by label being added (works for all branch)

permissions:
  issues: write
  pull-requests: write

jobs:
  codex-reviewed-validation:
    name: codex reviewed status validation
    runs-on: ubuntu-latest
    # if: github.event.label.name == 'good first issue'
    steps:
      - name: Verify sender
        uses: actions/github-script@v7
        with:
          script: |
            const isCorrectLabel = context.payload.label.name === "good first issue";
            const isCorrectSender = context.payload.sender.login === "thiru2612";

            if (!isCorrectLabel || !isCorrectSender) {
              core.setFailed(`Check failed — label: ${isCorrectLabel}, sender: ${isCorrectSender}`);
            }

