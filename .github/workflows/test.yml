name: Manual Codex Review

on:
  pull_request:
    types:
      - synchronize
      - labeled
      - unlabeled

permissions:
  pull-requests: write

jobs:
  codex-reviewed-validation:
    name: codex reviewed status validation
    runs-on: ubuntu-latest

    steps:
      - name: Validate approval label
        uses: actions/github-script@v7
        with:
          script: |
            const GOOD_LABEL = "good first issue";
            const AUTHORIZED_USER = "thiru2612";

            const action = context.payload.action;
            const sender = context.payload.sender.login;
            const eventLabel = context.payload.label?.name;

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;

            // Current labels on the PR
            const labels = context.payload.pull_request.labels.map(label => label.name);

            // If someone other than the authorized user adds the approval label,
            // remove it and fail the check.
            if (
              action === "labeled" &&
              eventLabel === GOOD_LABEL &&
              sender !== AUTHORIZED_USER
            ) {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: pull_number,
                name: GOOD_LABEL
              });

              core.setFailed(
                `Only '${AUTHORIZED_USER}' can add the '${GOOD_LABEL}' label. '${sender}' is not authorized.`
              );
              return;
            }

            // Final approval state
            if (labels.includes(GOOD_LABEL)) {
              console.log("✅ PR is approved.");
            } else {
              core.setFailed(
                `PR is not approved. Missing '${GOOD_LABEL}' label.`
              );
            }