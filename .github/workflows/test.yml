name: Manual Codex Review

on:
  pull_request:
    types:
      - labeled # - triggered by label being added (works for all branch)

permissions:
  issues: write
  pull-requests: write

jobs:
  codex-reviewed-validation:
    name: codex reviewed status validation
    runs-on: ubuntu-latest
    # if: github.event.label.name == 'good first issue'
    steps:
      - name: Verify sender
        uses: actions/github-script@v7
        with:
              steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);

            if (!labels.includes("good first issue")) {
              core.setFailed("PR is missing the 'good first issue' label.");
              return;
            }

            if (context.payload.sender.login !== "thiru2612") {
              core.setFailed("Only thiru2612 may add/remove this label.");
              return;
            }
