name: Manual Codex Review

on:
  pull_request:
    types:
      - labeled # - triggered by label being added (works for all branch)

permissions:
  issues: write
  pull-requests: write

jobs:
  codex-reviewed-validation:
    name: codex reviewed status validation
    if: github.event.label.name == 'good first issue'
    runs-on: ubuntu-latest
    steps:
      - name: Verify sender
        uses: actions/github-script@v7
        with:
          script: |
            if (context.payload.sender.login !== "thiru") {
              core.setFailed("Sender is not thiru2612");
            }